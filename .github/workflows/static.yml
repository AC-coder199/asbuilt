</head>
<body>
    <!-- Hero Section -->
    <div class="hero">
        <div class="container">
            <h1>As-Built Drawings</h1>
            <p class="subtitle">Understand What You Already Have Before Deciding What to Change</p>
            <p>If you're thinking about renovating your home but aren't completely sure what you want to do yet, as-built drawings are one of the best places to start.</p>
            <p>Accurate drawings of your existing house give you a clear picture of the layout, dimensions and major existing conditions of the building. From there, you can explore renovation ideas, compare different options, speak more effectively with contractors and start deciding where your budget will have the biggest impact.</p>
            <p>You don't need to know exactly what you want to renovate before having your house drawn. Sometimes the drawings are what help you figure that out.</p>
            <a href="#quote" class="btn btn-large">REQUEST AN AS-BUILT DRAWING QUOTE</a>
        </div>
    </div>

    <!-- Budget Section -->
    <section>
        <div class="container">
            <h2>You May Have $300,000 Worth of Ideas and a $100,000 Budget</h2>
            <p>That is where having accurate existing house plans becomes extremely useful.</p>
            <p>You might be considering a new kitchen, opening walls, renovating the basement, adding a bathroom, moving the laundry room, building an addition or changing several areas of the house over time.</p>
            <p>But you probably aren't going to do everything at once.</p>

            <div class="budget-highlight">
                <p><strong>As-built drawings allow you to look at the house as one complete project and start deciding:</strong></p>
                <ul class="checklist">
                    <li>What should be renovated first</li>
                    <li>Which projects should be done together</li>
                    <li>What can wait until later</li>
                    <li>Which ideas fit your budget</li>
                    <li>Which ideas may not be worth pursuing at all</li>
                </ul>
            </div>

            <p>Sometimes drawing an idea is enough to realize that it isn't actually what you wanted or needed.</p>
            <p>That can save a lot of money before construction ever begins.</p>
        </div>
    </section>

    <!-- Contractors Section -->
    <section>
        <div class="container">
            <h2>Better Plans. Better Conversations With Contractors.</h2>
            <p>Without drawings, early conversations with builders can produce extremely broad construction estimates because everyone may be imagining a different scope of work.</p>
            <p>One contractor may assume a wall stays. Another may assume it is removed. One may account for structural work while another does not.</p>
            <p>With measured as-built house drawings, everyone has the same starting point.</p>
            <p>Contractors can review the existing layout, dimensions, windows, doors, stairs, fixtures and other documented conditions while discussing your renovation ideas.</p>
            <p>As-built drawings will not replace detailed renovation or permit drawings, but they can make early planning and budgeting conversations far more useful and realistic.</p>
        </div>
    </section>

    <!-- Services Section -->
    <section>
        <div class="container">
            <h2>What Can Be Included in As-Built Drawings?</h2>
            <p>Your drawing package can be customized depending on how much information you want documented.</p>
            <h3>Choose What You Need</h3>

            <div class="services-grid">
                <div class="service-item">
                    <h4><span class="checkbox"></span>Measured Floor Plans</h4>
                    <p>Basement, main floor, upper floors, garage and other levels.</p>
                </div>

                <div class="service-item">
                    <h4><span class="checkbox"></span>Exterior Elevations</h4>
                    <p>Front, rear and side views of the existing house.</p>
                </div>

                <div class="service-item">
                    <h4><span class="checkbox"></span>Roof Plan</h4>
                    <p>Roof shape, slopes, ridges, valleys and major features.</p>
                </div>

                <div class="service-item">
                    <h4><span class="checkbox"></span>Probable Structural Framing</h4>
                    <p>Visible or reasonably determinable beams, columns, bearing walls, joist directions and other structural conditions.</p>
                </div>

                <div class="service-item">
                    <h4><span class="checkbox"></span>Mechanical Information</h4>
                    <p>Furnace locations, supply registers, return-air grilles and general visible ductwork.</p>
                </div>

                <div class="service-item">
                    <h4><span class="checkbox"></span>Plumbing Fixtures</h4>
                    <p>Existing toilets, sinks, tubs, showers, laundry connections and other visible plumbing fixtures.</p>
                </div>

                <div class="service-item">
                    <h4><span class="checkbox"></span>Ceiling Heights & Interior Features</h4>
                    <p>Bulkheads, level changes, stairs and other important existing conditions.</p>
                </div>

                <div class="service-item">
                    <h4><span class="checkbox"></span>3D Existing House Model</h4>
                    <p>A three-dimensional model to better understand the existing building and explore future renovation ideas.</p>
                </div>

                <div class="service-item">
                    <h4><span class="checkbox"></span>Site & Topography</h4>
                    <p>Building location, exterior features, grading and topographic information where required.</p>
                </div>
            </div>

            <h3>You Don't Have to Include Everything</h3>
            <p>A homeowner planning a kitchen renovation may only need accurate floor plans and structural information.</p>
            <p>Someone considering an addition or a long-term whole-house renovation may benefit from a much more detailed package.</p>
            <p>The more information that needs to be measured, investigated and drawn, the greater the cost of the as-built package.</p>
            <p>We can tailor the scope around what will actually be useful to you.</p>
        </div>
    </section>

    <!-- Decision Making Section -->
    <section>
        <div class="container">
            <h2>Make Decisions on Paper Before Making Expensive Decisions on Site</h2>
            <p>Once your existing house has been accurately documented, renovation ideas can be explored against the real building.</p>
            <ul class="checklist">
                <li>Could that wall be removed?</li>
                <li>Would an addition actually improve the layout?</li>
                <li>Could the existing space be rearranged instead?</li>
                <li>Should you renovate the basement before changing the main floor?</li>
                <li>Will something you build today interfere with something you want to do five years from now?</li>
            </ul>
            <p>As-built drawings help turn those questions into something you can actually study.</p>
            <p>Sometimes the smartest renovation decision is discovering what you don't need to renovate.</p>
        </div>
    </section>

    <!-- Long-term Value Section -->
    <section>
        <div class="container">
            <h2>Useful Today. Useful Years From Now.</h2>
            <p>Even if you don't renovate immediately, there is value in having an accurate set of house plans.</p>
            <p>A few years from now you may want to renovate the basement, build an addition, change the kitchen or discuss another project with a contractor.</p>
            <p>Instead of starting from scratch, you already have a documented starting point.</p>
            <p>It is simply useful to have a proper set of drawings of your own house that you can reference whenever you need them.</p>
        </div>
    </section>

    <!-- Process Flow Section -->
    <section>
        <div class="container">
            <h2>As-Built Drawings vs. Renovation Drawings</h2>

            <div class="process-flow">
                <div class="process-step">
                    <h4>AS-BUILT DRAWINGS</h4>
                    <p>Document your house as it exists today.</p>
                </div>

                <div class="process-arrow">↓</div>

                <div class="process-step">
                    <h4>DESIGN DRAWINGS</h4>
                    <p>Explore what the house could become.</p>
                </div>

                <div class="process-arrow">↓</div>

                <div class="process-step">
                    <h4>PERMIT / CONSTRUCTION DRAWINGS</h4>
                    <p>Show what is actually going to be built.</p>
                </div>
            </div>

            <p style="text-align: center; margin-top: 30px;">The as-built drawings become the foundation for the next stage whenever you're ready.</p>
        </div>
    </section>

    <!-- Final CTA -->
    <div class="final-cta" id="quote">
        <div class="container">
            <h2>Start With the House You Already Have</h2>
            <p>You don't need to have your renovation figured out.</p>
            <p>If you have several ideas, an uncertain budget or simply want to understand the possibilities for your home, accurate as-built drawings can give you the information you need to start planning properly.</p>
            <p style="margin-top: 30px; font-weight: 600;">Understand what you have.<br>Explore what is possible.<br>Decide what is actually worth changing.</p>
            <a href="mailto:info@gabrielestatedesign.com?subject=As-Built%20Drawing%20Quote%20Request" class="btn btn-large">GET A QUOTE FOR AS-BUILT DRAWINGS</a>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="container">
            <h3>Gabriel Estate Design Inc.</h3>
            <p>As-Built Drawings & Residential Architectural Design</p>
            <p>Hamilton, Ontario</p>
        </div>
    </footer>
</body>
</html>
