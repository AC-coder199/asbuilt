        }

        /* Footer */
        footer {
            background: #2c3e50;
            color: white;
            text-align: center;
            padding: 40px 0;
        }

        footer h3 {
            color: white;
            margin-bottom: 10px;
        }

        footer p {
            opacity: 0.8;
            margin-bottom: 5px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2rem;
            }

            .hero .subtitle {
                font-size: 1.1rem;
            }

            h2 {
                font-size: 1.8rem;
            }

            section {
                padding: 50px 0;
            }

            .process-flow {
                flex-direction: column;
            }

            .process-arrow {
                transform: rotate(90deg);
            }
        }
